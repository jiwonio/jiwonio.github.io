<style id="critical-css">
:root{color-scheme:light;--color-bg:#fff;--color-text:#515151;--color-text-strong:#303030;--color-heading:#313131;--color-muted:#9a9a9a;--color-masthead:#505050;--color-masthead-subtle:#c0c0c0;--color-link:#268bd2;--color-border:#e5e5e5}
@media(prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--color-bg:#1a1a2e;--color-text:#c8c8d4;--color-text-strong:#e8e8f0;--color-heading:#f0f0f8;--color-muted:#8b8b9e;--color-masthead:#d4d4e0;--color-masthead-subtle:#6b6b80;--color-link:#5eb3f0;--color-border:#2e2e42}}
html[data-theme=light]{color-scheme:light;--color-bg:#fff;--color-text:#515151;--color-text-strong:#303030;--color-heading:#313131;--color-muted:#9a9a9a;--color-masthead:#505050;--color-masthead-subtle:#c0c0c0;--color-link:#268bd2;--color-border:#e5e5e5}
html[data-theme=dark]{color-scheme:dark;--color-bg:#1a1a2e;--color-text:#c8c8d4;--color-text-strong:#e8e8f0;--color-heading:#f0f0f8;--color-muted:#8b8b9e;--color-masthead:#d4d4e0;--color-masthead-subtle:#6b6b80;--color-link:#5eb3f0;--color-border:#2e2e42}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{font-size:15px;line-height:1.5;font-optical-sizing:auto}
html.html-lang-ko{font-family:"Noto Sans KR",system-ui,sans-serif}
html.html-lang-ja{font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif}
html.html-lang-zh{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
html.html-lang-en{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{color:var(--color-text);background:var(--color-bg)}
a{color:var(--color-link);text-decoration:none}
.container{max-width:42rem;padding-left:1.5rem;padding-right:1.5rem;margin-left:auto;margin-right:auto}
.skip-link{position:absolute;top:-100%;left:1.5rem;z-index:2000;padding:.5rem 1rem;border:1px solid var(--color-border);border-radius:.25rem;background:var(--color-bg);color:var(--color-link);font-weight:600}
.masthead{padding-top:2rem;padding-bottom:2rem;margin-bottom:0}
.masthead-title{margin-top:1rem;margin-bottom:0;color:var(--color-masthead);float:left}
.masthead-title a{color:inherit}
.masthead-title small{font-size:75%;font-weight:400;color:var(--color-masthead-subtle)}
.masthead-nav{margin-top:1rem;float:right;display:flex;align-items:center;gap:.5rem}
.cf::after{content:"";display:table;clear:both}
.post{margin-bottom:3em}
.post-title,.post-title a{margin-top:0;color:var(--color-text-strong)}
.post-date{display:block;margin-top:-.5rem;margin-bottom:1rem;color:var(--color-muted)}
h1,h2,h3{margin-bottom:.5rem;font-weight:700;line-height:1.25;color:var(--color-heading)}
h2{font-size:1.5rem;margin-top:1rem}
p{margin-top:0;margin-bottom:1rem}
</style>
