{%- assign current_lang = page.lang | default: site.default_lang | default: 'ko' -%}
{%- assign lang_meta = site.data.languages[current_lang] -%}
<link href="/assets/vendor/pagefind/pagefind-ui.css" rel="stylesheet">
<div id="pagefind-search"></div>
<script src="/assets/vendor/pagefind/pagefind-ui.js"></script>
<script>
  window.addEventListener("DOMContentLoaded", function () {
    if (typeof PagefindUI === "undefined") {
      document.getElementById("pagefind-search").innerHTML =
        "<p>{{ lang_meta.search_index_error }}</p>";
      return;
    }
    new PagefindUI({
      element: "#pagefind-search",
      bundlePath: "/pagefind/",
      showSubResults: true,
      resetStyles: false,
    });
  });
</script>
