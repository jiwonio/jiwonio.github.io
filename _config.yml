# ── Jekyll ────────────────────────────────────────────────────────
paginate: 5
paginate_path: "/page/:num/"
excerpt_separator: "<!--more-->"

sass:
  sass_dir: _sass
  style: "compressed"

jekyll-archives:
  enabled:
    - tags
    - year
  permalinks:
    tag: "/archive/tag/:name/"
    year: "/archive/:year/"
  layouts:
    tag: tag
    year: year

plugins:
  - jekyll-paginate
  - jekyll-archives
  - jekyll-sitemap

# 사이트맵에서 제외할 경로 (필요 시 추가)
