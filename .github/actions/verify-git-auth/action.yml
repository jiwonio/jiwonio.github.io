name: Verify Git Auth secrets
description: Ensure GitHub App or MY_PAT credentials are configured

inputs:
  app-id:
    required: false
    default: ""
  private-key:
    required: false
    default: ""
  pat:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if [ -n "${{ inputs.app-id }}" ] && [ -n "${{ inputs.private-key }}" ]; then
          echo "GitHub App credentials found."
          exit 0
        fi
        if [ -n "${{ inputs.pat }}" ]; then
          echo "MY_PAT fallback found."
          exit 0
        fi
        echo "Missing git auth: set GH_APP_ID + GH_APP_PRIVATE_KEY or MY_PAT."
        exit 1