name: Pre-merge validation
description: >
  Content gate before publishing generated content. Full site build, Pagefind,
  htmlproofer, and unit tests run on Deploy (jekyll.yml) only.

runs:
  using: composite
  steps:
    - name: Validate posts
      shell: bash
      run: python scripts/validate_posts.py

    - name: Validate changed post reference URLs
      shell: bash
      run: python scripts/validate_posts.py --check-ref-urls --changed-only

    - name: Audit translation completeness
      shell: bash
      run: python scripts/validate_posts.py --audit-translations

    - name: Sync drift checks
      shell: bash
      run: |
        python scripts/sync_post_images.py --dry-run
        python scripts/sync_translation_dates.py --dry-run

    - name: Verify font subsets
      shell: bash
      run: python scripts/check_font_subset.py
