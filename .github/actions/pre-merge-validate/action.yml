name: Pre-merge validation
description: Automated gate before auto-merging generated content

runs:
  using: composite
  steps:
    - name: Python unit tests
      shell: bash
      run: python -m unittest discover -s scripts/tests -v

    - name: Validate posts
      shell: bash
      run: python scripts/validate_posts.py

    - name: Audit translation completeness
      shell: bash
      run: python scripts/validate_posts.py --audit-translations

    - name: Sync drift checks
      shell: bash
      run: |
        python scripts/sync_post_images.py --dry-run
        python scripts/sync_translation_dates.py --dry-run

    - name: Build Jekyll
      shell: bash
      env:
        JEKYLL_ENV: production
      run: bundle exec jekyll build --baseurl ""

    - name: Build Pagefind index
      shell: bash
      run: npx --yes pagefind@1.3.0 --site _site

    - name: Proof HTML
      shell: bash
      run: bundle exec htmlproofer ./_site --disable-external --allow-hash-href --ignore-empty-alt