name: Weekly AI Post Generation

on:
  schedule:
    # 매주 월요일 오전 9시 (KST 기준, UTC 00:00) 실행
    - cron: '0 0 * * 1'
  workflow_dispatch: # 수동으로도 실행 가능하게 설정

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 커밋 및 푸시 권한 허용

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install google-generativeai

      - name: Run generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_post.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add _posts/*.md
          git commit -m "Auto-generated post by Gemini AI" || echo "No changes to commit"
          git push
