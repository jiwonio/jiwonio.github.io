name: Weekly AI Post Generation

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_post.py

      - name: Validate generated posts
        run: python scripts/validate_posts.py

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Commit, Push and Create PR
        env:
          # PAT is scoped to the only step that pushes and merges the generated post.
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          git config --local user.email "min@jiwon.io"
          git config --local user.name "jwjp"
          gh auth setup-git
          
          git add _posts/ uploads/ assets/ scripts/blog_i18n.py
          
          if ! git diff-index --quiet HEAD; then
            BRANCH_NAME="ai-post-$(date +%Y%m%d-%H%M%S)"
            git checkout -b $BRANCH_NAME
            
            git commit -m "Add Auto-generated post and thumbnail by AI"
            git push origin $BRANCH_NAME
            
            PR_URL=$(gh pr create \
              --title "✨ [AI 자동작성] 주간 블로그 포스트 발행" \
              --body "Gemini AI가 작성하고 썸네일 이미지를 생성한 포스트입니다. 게시물 검증과 Jekyll 빌드를 통과했습니다." \
              --base gh-pages \
              --head $BRANCH_NAME)
              
            echo "PR Created: $PR_URL"

            gh pr merge $BRANCH_NAME --merge --delete-branch
            
            echo "✅ PR 생성 및 즉시 병합이 완료되었습니다!"
          else
            echo "⚠️ 커밋할 새로운 변경 사항이 없습니다."
          fi
