name: Weekly AI Post Generation

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

# Node.js 20 경고 메시지를 없애기 위한 환경 변수 강제 설정
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_post.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # _posts 폴더 전체를 강제로 스테이징
          git add _posts/
          
          # 변경 사항이 있는지 확인 후 커밋 및 푸시하는 확실한 방식
          if ! git diff-index --quiet HEAD; then
            git commit -m "Add Auto-generated post by AI"
            git push
            echo "✅ 새 글이 성공적으로 커밋되고 푸시되었습니다."
          else
            echo "⚠️ 커밋할 새로운 변경 사항이 없습니다."
          fi
