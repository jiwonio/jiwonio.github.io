name: Bi-weekly AI Post Generation

on:
  schedule:
    - cron: '0 0 * * 1'
    - cron: '0 0 * * 4'
  workflow_dispatch:
    inputs:
      post_type:
        description: '생성할 글 유형'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - deep-dive
          - ai-news
      dry_run:
        description: 'RSS 수집만 확인 (API 호출 없음)'
        required: false
        default: false
        type: boolean
      auto_merge:
        description: 'PR 자동 머지'
        required: false
        default: true
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run generation script
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          POST_TYPE="${{ github.event.inputs.post_type || 'auto' }}"
          DOW=$(date -u +%u)
          echo "RUN_GENERATION=true" >> "$GITHUB_ENV"

          if [ "$POST_TYPE" = "deep-dive" ]; then
            SCRIPT="scripts/generate_post.py"
            PR_TITLE="✨ [AI 자동작성] 심층 기술 포스트"
            COMMIT_MSG="Add auto-generated deep-dive post"
          elif [ "$POST_TYPE" = "ai-news" ]; then
            SCRIPT="scripts/generate_ai_news.py"
            PR_TITLE="✨ [AI 자동작성] 개발자 관점 AI 소식"
            COMMIT_MSG="Add auto-generated ai-news digest"
          elif [ "$DOW" = "1" ]; then
            SCRIPT="scripts/generate_post.py"
            PR_TITLE="✨ [AI 자동작성] 심층 기술 포스트"
            COMMIT_MSG="Add auto-generated deep-dive post"
          elif [ "$DOW" = "4" ]; then
            SCRIPT="scripts/generate_ai_news.py"
            PR_TITLE="✨ [AI 자동작성] 개발자 관점 AI 소식"
            COMMIT_MSG="Add auto-generated ai-news digest"
          else
            echo "예상치 못한 요일(DOW=$DOW), 스킵합니다."
            echo "RUN_GENERATION=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "SCRIPT=$SCRIPT" >> "$GITHUB_ENV"
          echo "PR_TITLE=$PR_TITLE" >> "$GITHUB_ENV"
          echo "COMMIT_MSG=$COMMIT_MSG" >> "$GITHUB_ENV"

          DRY_RUN="${{ github.event.inputs.dry_run }}"
          if [ "$DRY_RUN" = "true" ]; then
            if [ "$SCRIPT" = "scripts/generate_ai_news.py" ]; then
              python "$SCRIPT" --dry-run
            else
              echo "dry_run은 ai-news에서만 지원됩니다."
              exit 1
            fi
            echo "RUN_GENERATION=false" >> "$GITHUB_ENV"
            exit 0
          fi

          python "$SCRIPT"

      - name: Validate generated posts
        if: env.RUN_GENERATION == 'true'
        run: python scripts/validate_posts.py

      - name: Build Jekyll site
        if: env.RUN_GENERATION == 'true'
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Commit, Push and Create PR
        if: env.RUN_GENERATION == 'true'
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          git config --local user.email "min@jiwon.io"
          git config --local user.name "jwjp"
          gh auth setup-git

          git add _posts/ uploads/ assets/ scripts/

          if ! git diff-index --quiet HEAD; then
            BEFORE_SHA=$(git rev-parse HEAD)
            BRANCH_NAME="ai-post-$(date +%Y%m%d-%H%M%S)"
            git checkout -b $BRANCH_NAME

            git commit -m "$COMMIT_MSG"
            AFTER_SHA=$(git rev-parse HEAD)

            python scripts/submit_indexnow.py --from-git "$BEFORE_SHA" "$AFTER_SHA" || true

            git push origin $BRANCH_NAME

            PR_URL=$(gh pr create \
              --title "$PR_TITLE" \
              --body "Gemini AI가 작성하고 썸네일 이미지를 생성한 포스트입니다. 게시물 검증과 Jekyll 빌드를 통과했습니다." \
              --base gh-pages \
              --head $BRANCH_NAME)

            echo "PR Created: $PR_URL"

            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              AUTO_MERGE="${{ github.event.inputs.auto_merge }}"
            else
              AUTO_MERGE="true"
            fi

            if [ "$AUTO_MERGE" = "true" ]; then
              gh pr merge $BRANCH_NAME --merge --delete-branch
              echo "✅ PR 생성 및 즉시 병합이 완료되었습니다!"
            else
              echo "📋 PR이 열린 상태로 남았습니다. 검토 후 수동 머지하세요: $PR_URL"
            fi
          else
            echo "⚠️ 커밋할 새로운 변경 사항이 없습니다."
          fi

  notify-failure:
    runs-on: ubuntu-latest
    needs: build-and-post
    if: failure()
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ Bi-weekly AI Post Generation failed\n${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Print failure summary
        run: |
          echo "::error::Bi-weekly AI Post Generation failed."
          echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"