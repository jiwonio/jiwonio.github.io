name: Bi-weekly AI Post Generation

on:
  schedule:
    - cron: '0 0 * * 1'
    - cron: '0 0 * * 4'
  workflow_dispatch:
    inputs:
      post_type:
        description: '생성할 글 유형'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - deep-dive
          - ai-news
      dry_run:
        description: 'RSS 수집만 확인 (API 호출 없음)'
        required: false
        default: false
        type: boolean
      auto_merge:
        description: 'PR 자동 머지 (기본: true)'
        required: false
        default: true
        type: boolean
      text_provider:
        description: '글 생성 LLM provider (auto=post_type 라우팅)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - gemini
          - anthropic
          - openai
          - xai
      translation_provider:
        description: '번역 LLM provider (auto=폴백 체인)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - gemini
          - anthropic
          - openai
          - xai
      edition_date:
        description: 'ai-news slug 날짜 (YYYY-MM-DD, 누락 호수 복구용, 비우면 오늘)'
        required: false
        default: ''
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LLM_USAGE_LOG: llm-usage.jsonl

concurrency:
  group: ai-post-generation
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Verify git auth
        uses: ./.github/actions/verify-git-auth
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          pat: ${{ secrets.MY_PAT }}

      - name: Verify LLM secrets
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ] \
            && [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] \
            && [ -z "${{ secrets.OPENAI_API_KEY }}" ] \
            && [ -z "${{ secrets.XAI_API_KEY }}" ]; then
            echo "At least one LLM API key secret is required."
            exit 1
          fi

      - name: Run generation script
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          POST_TYPE="${{ github.event.inputs.post_type || 'auto' }}"
          DOW=$(date -u +%u)
          echo "RUN_GENERATION=true" >> "$GITHUB_ENV"

          if [ "$POST_TYPE" = "deep-dive" ]; then
            SCRIPT="scripts/generate_post.py"
            PR_TITLE="✨ [AI 자동작성] 심층 기술 포스트"
            COMMIT_MSG="Add auto-generated deep-dive post"
            echo "POST_TYPE=deep-dive" >> "$GITHUB_ENV"
          elif [ "$POST_TYPE" = "ai-news" ]; then
            SCRIPT="scripts/generate_ai_news.py"
            PR_TITLE="✨ [AI 자동작성] 개발자 관점 AI 소식"
            COMMIT_MSG="Add auto-generated ai-news digest"
            echo "POST_TYPE=ai-news" >> "$GITHUB_ENV"
          elif [ "$DOW" = "1" ]; then
            SCRIPT="scripts/generate_post.py"
            PR_TITLE="✨ [AI 자동작성] 심층 기술 포스트"
            COMMIT_MSG="Add auto-generated deep-dive post"
            echo "POST_TYPE=deep-dive" >> "$GITHUB_ENV"
          elif [ "$DOW" = "4" ]; then
            SCRIPT="scripts/generate_ai_news.py"
            PR_TITLE="✨ [AI 자동작성] 개발자 관점 AI 소식"
            COMMIT_MSG="Add auto-generated ai-news digest"
            echo "POST_TYPE=ai-news" >> "$GITHUB_ENV"
          else
            echo "예상치 못한 요일(DOW=$DOW), 스킵합니다."
            echo "RUN_GENERATION=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "SCRIPT=$SCRIPT" >> "$GITHUB_ENV"
          echo "PR_TITLE=$PR_TITLE" >> "$GITHUB_ENV"
          echo "COMMIT_MSG=$COMMIT_MSG" >> "$GITHUB_ENV"

          DRY_RUN="${{ github.event.inputs.dry_run }}"
          if [ "$DRY_RUN" = "true" ]; then
            if [ "$SCRIPT" = "scripts/generate_ai_news.py" ]; then
              python "$SCRIPT" --dry-run
            else
              echo "dry_run은 ai-news에서만 지원됩니다."
              exit 1
            fi
            echo "RUN_GENERATION=false" >> "$GITHUB_ENV"
            exit 0
          fi

          TEXT_PROVIDER="${{ github.event.inputs.text_provider || 'auto' }}"
          TRANSLATION_PROVIDER="${{ github.event.inputs.translation_provider || 'auto' }}"
          EXTRA_ARGS=()
          if [ "$TEXT_PROVIDER" != "auto" ]; then
            EXTRA_ARGS+=(--text-provider "$TEXT_PROVIDER")
          fi
          if [ "$TRANSLATION_PROVIDER" != "auto" ]; then
            EXTRA_ARGS+=(--translation-provider "$TRANSLATION_PROVIDER")
          fi
          EDITION_DATE="${{ github.event.inputs.edition_date }}"
          if [ -n "$EDITION_DATE" ] && [ "$SCRIPT" = "scripts/generate_ai_news.py" ]; then
            EXTRA_ARGS+=(--date "$EDITION_DATE")
          fi

          python "$SCRIPT" "${EXTRA_ARGS[@]}"

      - name: Pre-merge validation
        if: env.RUN_GENERATION == 'true'
        id: pre_merge
        uses: ./.github/actions/pre-merge-validate

      - name: Setup git auth
        if: env.RUN_GENERATION == 'true'
        uses: ./.github/actions/setup-git-auth
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          pat: ${{ secrets.MY_PAT }}

      - name: Commit, push, create PR, and auto-merge
        if: env.RUN_GENERATION == 'true'
        run: |
          git config --local user.email "min@jiwon.io"
          git config --local user.name "jwjp"

          git add _posts/ uploads/

          if ! git diff-index --quiet HEAD; then
            BEFORE_SHA=$(git rev-parse HEAD)
            BRANCH_NAME="ai-post-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH_NAME"
            git commit -m "$COMMIT_MSG"
            AFTER_SHA=$(git rev-parse HEAD)

            if ! python scripts/submit_indexnow.py --from-git "$BEFORE_SHA" "$AFTER_SHA"; then
              echo "::warning::IndexNow submission failed (non-fatal)"
            fi

            git push origin "$BRANCH_NAME"

            PR_BODY=$(cat <<'EOF'
          Multi-LLM 파이프라인으로 작성·번역·썸네일을 자동 생성했습니다.

          ## Automated checks (all passed)
          - Python unit tests
          - `validate_posts.py` (metadata, links, language)
          - Translation completeness audit
          - Sync drift dry-run (images, dates)
          - Jekyll build + Pagefind + htmlproofer
          EOF
          )

            PR_URL=$(gh pr create \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --base gh-pages \
              --head "$BRANCH_NAME")

            echo "PR Created: $PR_URL"

            AUTO_MERGE="${{ github.event.inputs.auto_merge }}"
            if [ "${{ github.event_name }}" = "schedule" ]; then
              AUTO_MERGE="true"
            fi
            if [ -z "$AUTO_MERGE" ]; then
              AUTO_MERGE="true"
            fi

            if [ "$AUTO_MERGE" = "true" ]; then
              gh pr merge "$BRANCH_NAME" --merge --delete-branch
              echo "✅ PR 자동 병합 완료"
            else
              echo "PR left open (auto_merge=false): $PR_URL"
            fi
          else
            echo "⚠️ 커밋할 새로운 변경 사항이 없습니다."
          fi

      - name: LLM usage report
        if: always() && env.RUN_GENERATION == 'true'
        run: |
          LOG="${LLM_USAGE_LOG:-llm-usage.jsonl}"
          if [ -f "$LOG" ]; then
            python scripts/usage_report.py "$LOG" --warn-budget 50
          fi

      - name: Notify Slack (in-job failure detail)
        if: failure()
        uses: ./.github/actions/notify-slack-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: Bi-weekly AI Post Generation failed
          failed-step: ${{ steps.pre_merge.outcome == 'failure' && 'pre-merge validation (tests, validate_posts, Jekyll, htmlproofer)' || steps.generate.outcome == 'failure' && 'post generation (LLM pipeline)' || 'see Actions log' }}