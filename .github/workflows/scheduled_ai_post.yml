name: Weekly AI Post Generation

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # gh CLI 명령어를 내 계정 권한으로 실행하기 위해 발급한 PAT 사용
  GH_TOKEN: ${{ secrets.MY_PAT }}

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@@v4
        with:
          token: ${{ secrets.MY_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai Pillow

      - name: Run generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_post.py

      - name: Commit, Push and Create PR
        run: |
          # 뱃지 획득을 위해 본인의 정보로 설정 (로그 확인 결과 반영)
          git config --local user.email "min@jiwon.io"
          git config --local user.name "jwjp"
          
          git add _posts/ uploads/
          
          if ! git diff-index --quiet HEAD; then
            BRANCH_NAME="ai-post-$(date +%Y%m%d-%H%M%S)"
            git checkout -b $BRANCH_NAME
            
            git commit -m "Add Auto-generated post and thumbnail by AI"
            git push origin $BRANCH_NAME
            
            # 1. PR 생성
            PR_URL=$(gh pr create \
              --title "✨ [AI 자동작성] 주간 블로그 포스트 발행" \
              --body "Gemini AI가 작성하고 썸네일 이미지를 생성한 포스트입니다." \
              --base gh-pages \
              --head $BRANCH_NAME)
              
            echo "PR Created: $PR_URL"

            # 2. 즉시 병합 (에러 방지를 위해 --auto 제거 및 --merge 사용)
            # --admin 플래그는 혹시 모를 보호 규칙 우회를 위해 추가 (PAT 권한 필요)
            gh pr merge $BRANCH_NAME --merge --delete-branch --admin
            
            echo "✅ PR 생성 및 즉시 병합이 완료되었습니다!"
          else
            echo "⚠️ 커밋할 새로운 변경 사항이 없습니다."
          fi
