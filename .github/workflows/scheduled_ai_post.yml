name: Scheduled AI Post Generation

# Quality-first policy (2026-08-04):
# - Schedule: Wed 00:00 UTC → deep-dive draft only (not ai-news)
# - Default publish path: open PR for human editorial review (no auto merge)
# - ai-news: workflow_dispatch only when an operator chooses to run it
# - Set direct_push=true only for intentional hotfixes / trusted catch-up
on:
  schedule:
    - cron: '0 0 * * 3'
  workflow_dispatch:
    inputs:
      post_type:
        description: '생성할 글 유형 (auto=deep-dive; ai-news는 수동 선택)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - deep-dive
          - ai-news
      dry_run:
        description: 'RSS 수집만 확인 (API 호출 없음, ai-news 전용)'
        required: false
        default: false
        type: boolean
      direct_push:
        description: 'true=gh-pages 직푸시 / false=PR만 (품질 우선 기본값)'
        required: false
        default: false
        type: boolean
      text_provider:
        description: '글 생성 LLM provider (auto=post_type 라우팅)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - gemini
          - anthropic
          - openai
          - xai
      translation_provider:
        description: '번역 LLM provider (auto=폴백 체인)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - gemini
          - anthropic
          - openai
          - xai
      edition_date:
        description: '백필 날짜 (YYYY-MM-DD). ai-news slug·deep-dive 파일명/date 고정. 비우면 오늘'
        required: false
        default: ''
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LLM_USAGE_LOG: llm-usage.jsonl

concurrency:
  group: ai-post-generation
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install -e ./scripts

      - name: Verify git auth
        uses: ./.github/actions/verify-git-auth
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          pat: ${{ secrets.MY_PAT }}

      - name: Verify LLM secrets
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ] \
            && [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] \
            && [ -z "${{ secrets.OPENAI_API_KEY }}" ] \
            && [ -z "${{ secrets.XAI_API_KEY }}" ]; then
            echo "At least one LLM API key secret is required."
            exit 1
          fi

      - name: Run generation script
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          POST_TYPE="${{ github.event.inputs.post_type || 'auto' }}"
          DOW=$(date -u +%u)
          echo "RUN_GENERATION=true" >> "$GITHUB_ENV"

          # Quality-first: schedule and "auto" always mean deep-dive.
          # ai-news only when explicitly selected via workflow_dispatch.
          if [ "$POST_TYPE" = "ai-news" ]; then
            SCRIPT="scripts/generate_ai_news.py"
            COMMIT_MSG="Add auto-generated ai-news digest (draft for review)"
            PR_TITLE="📝 [편집 대기] AI News 초안"
            echo "POST_TYPE=ai-news" >> "$GITHUB_ENV"
          elif [ "$POST_TYPE" = "deep-dive" ] || [ "$POST_TYPE" = "auto" ]; then
            SCRIPT="scripts/generate_post.py"
            COMMIT_MSG="Add auto-generated deep-dive post (draft for review)"
            PR_TITLE="📝 [편집 대기] 심층 기술 포스트 초안"
            echo "POST_TYPE=deep-dive" >> "$GITHUB_ENV"
          else
            echo "Unknown post_type=$POST_TYPE (DOW=$DOW), skipping."
            echo "RUN_GENERATION=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "SCRIPT=$SCRIPT" >> "$GITHUB_ENV"
          echo "COMMIT_MSG=$COMMIT_MSG" >> "$GITHUB_ENV"
          echo "PR_TITLE=$PR_TITLE" >> "$GITHUB_ENV"

          DRY_RUN="${{ github.event.inputs.dry_run }}"
          if [ "$DRY_RUN" = "true" ]; then
            if [ "$SCRIPT" = "scripts/generate_ai_news.py" ]; then
              python "$SCRIPT" --dry-run
            else
              echo "dry_run은 ai-news에서만 지원됩니다."
              exit 1
            fi
            echo "RUN_GENERATION=false" >> "$GITHUB_ENV"
            exit 0
          fi

          TEXT_PROVIDER="${{ github.event.inputs.text_provider || 'auto' }}"
          TRANSLATION_PROVIDER="${{ github.event.inputs.translation_provider || 'auto' }}"
          EXTRA_ARGS=()
          if [ "$TEXT_PROVIDER" != "auto" ]; then
            EXTRA_ARGS+=(--text-provider "$TEXT_PROVIDER")
          fi
          if [ "$TRANSLATION_PROVIDER" != "auto" ]; then
            EXTRA_ARGS+=(--translation-provider "$TRANSLATION_PROVIDER")
          fi
          EDITION_DATE="${{ github.event.inputs.edition_date }}"
          if [ -n "$EDITION_DATE" ]; then
            EXTRA_ARGS+=(--date "$EDITION_DATE")
          fi

          python "$SCRIPT" "${EXTRA_ARGS[@]}"

      # Font/JS once after generation; Deploy re-verifies. No full Jekyll here.
      - name: Refresh derived assets
        if: env.RUN_GENERATION == 'true'
        run: |
          python scripts/build_site_js.py
          python scripts/check_font_subset.py --fix

      - name: Content validation gate
        if: env.RUN_GENERATION == 'true'
        id: pre_merge
        uses: ./.github/actions/pre-merge-validate

      - name: Setup git auth
        if: env.RUN_GENERATION == 'true'
        uses: ./.github/actions/setup-git-auth
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          pat: ${{ secrets.MY_PAT }}

      - name: Commit and publish
        if: env.RUN_GENERATION == 'true'
        run: |
          git config --local user.email "min@jiwon.io"
          git config --local user.name "jwjp"

          git add _posts/ uploads/ assets/vendor/ _data/noto_preload.yml assets/js/site.js

          if git diff-index --quiet HEAD; then
            echo "⚠️ 커밋할 새로운 변경 사항이 없습니다."
            exit 0
          fi

          # Quality-first defaults (GH_TOKEN comes from setup-git-auth):
          # - schedule → always PR (human review)
          # - workflow_dispatch → respect input (default false)
          # - empty/unset → false (never silent direct push)
          DIRECT_PUSH="${{ github.event.inputs.direct_push }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DIRECT_PUSH="false"
          fi
          if [ -z "$DIRECT_PUSH" ]; then
            DIRECT_PUSH="false"
          fi

          if [ "$DIRECT_PUSH" = "true" ]; then
            git commit -m "$COMMIT_MSG"
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
            echo "✅ gh-pages 직푸시 완료 (IndexNow·Jekyll 빌드는 Deploy 워크플로에서 처리)"
            echo "⚠️ direct_push=true was used — prefer PR + editorial review for quality."
          else
            BRANCH_NAME="ai-post-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH_NAME"
            git commit -m "$COMMIT_MSG"
            git push origin "$BRANCH_NAME"

            PR_BODY=$(cat <<'EOF'
          ## 품질 우선 정책 — 편집 후 머지

          AI 초안입니다. **그대로 머지하지 마세요.** 아래를 채운 뒤 머지합니다.

          ### 편집 체크리스트
          - [ ] 실제 경험·실측 수치·실패 사례 중 1개 이상 반영
          - [ ] 과장·일반론·문서 복붙 톤 제거
          - [ ] 기존 글과 주제가 겹치면 신규 대신 기존 글 보강 검토
          - [ ] 참고 링크·명령·버전 정보 확인
          - [ ] (선택) 번역본 핵심 문장 스팟 체크

          ### 자동 통과 항목 (콘텐츠 게이트)
          - `validate_posts.py` (metadata, links, language, translation structure)
          - Changed-post reference URL HEAD checks
          - Translation completeness audit
          - Sync drift dry-run (images, dates)
          - Font subset verify

          Full Jekyll + Pagefind + htmlproofer runs on Deploy after merge.
          EOF
          )

            PR_URL=$(gh pr create \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --base gh-pages \
              --head "$BRANCH_NAME")
            echo "PR opened for editorial review: $PR_URL"
          fi

      - name: LLM usage report
        if: always() && env.RUN_GENERATION == 'true'
        run: |
          LOG="${LLM_USAGE_LOG:-llm-usage.jsonl}"
          if [ -f "$LOG" ]; then
            python scripts/usage_report.py "$LOG" --warn-budget 75
          fi

      - name: Notify Slack (in-job failure detail)
        if: failure()
        uses: ./.github/actions/notify-slack-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: Scheduled AI Post Generation failed
          failed-step: ${{ steps.pre_merge.outcome == 'failure' && 'content validation gate (validate_posts, refs, translations)' || steps.generate.outcome == 'failure' && 'post generation (LLM pipeline)' || 'see Actions log' }}
