name: Deep-dive Translation Audit

on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Audit deep-dive translation completeness
        run: python scripts/validate_posts.py --audit-deep-dive

  notify-failure:
    runs-on: ubuntu-latest
    needs: audit
    if: failure()
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"⚠️ Deep-dive translation audit failed\n${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Print failure summary
        run: |
          echo "::error::Deep-dive translation audit failed."
          echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"