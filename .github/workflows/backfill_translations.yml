name: Backfill Post Translations

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "처리할 원문 포스트 수 (0 = 전체)"
        required: false
        default: "0"
      langs:
        description: "번역 언어 (쉼표 구분)"
        required: false
        default: "en,ja,zh"
      sleep:
        description: "API 호출 간 대기(초)"
        required: false
        default: "5"
      prepare_only:
        description: "메타데이터 정규화만 수행"
        type: boolean
        required: false
        default: false
      slug:
        description: "특정 slug만 처리 (비우면 전체)"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LLM_USAGE_LOG: llm-usage.jsonl

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          python -c "from google import genai; print('google-genai OK')"

      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.MY_PAT }}" ]; then
            echo "MY_PAT secret is missing (needed for PR creation)."
            exit 1
          fi
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ] \
            && [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] \
            && [ -z "${{ secrets.OPENAI_API_KEY }}" ] \
            && [ -z "${{ secrets.XAI_API_KEY }}" ]; then
            echo "At least one LLM API key secret is required."
            exit 1
          fi

      - name: Run backfill script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          ARGS=()
          if [ "${{ inputs.prepare_only }}" = "true" ]; then
            ARGS+=(--prepare)
          fi
          if [ "${{ inputs.limit }}" != "0" ]; then
            ARGS+=(--limit "${{ inputs.limit }}")
          fi
          if [ -n "${{ inputs.slug }}" ]; then
            ARGS+=(--slug "${{ inputs.slug }}")
          fi
          ARGS+=(--langs "${{ inputs.langs }}")
          ARGS+=(--sleep "${{ inputs.sleep }}")
          python scripts/backfill_translations.py "${ARGS[@]}"

      - name: Validate posts
        if: inputs.prepare_only != true
        run: python scripts/validate_posts.py

      - name: Create PR for translations
        if: inputs.prepare_only != true
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          git config user.email "min@jiwon.io"
          git config user.name "jwjp"
          gh auth setup-git

          git add _posts/ scripts/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          BRANCH_NAME="backfill-translations-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          git commit -m "Backfill post translations (${{ inputs.langs }})"
          git push origin "$BRANCH_NAME"

          PR_BODY=$(cat <<'EOF'
          Backfill translations generated by the multi-LLM pipeline.

          ## Review checklist
          - [ ] Translation accuracy and tone reviewed
          - [ ] Front matter (`lang`, `translation_key`, `slug`, `date`) correct
          - [ ] Reference links preserved and headings translated appropriately
          - [ ] No prompt leakage or external image URLs in body
          - [ ] `validate_posts.py` passed in CI
          EOF
          )

          PR_URL=$(gh pr create \
            --title "🌐 Backfill translations (${{ inputs.langs }})" \
            --body "$PR_BODY" \
            --base gh-pages \
            --head "$BRANCH_NAME")

          echo "PR Created: $PR_URL (manual review required)"

      - name: Build Jekyll site
        if: inputs.prepare_only != true
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: LLM usage report
        if: always() && inputs.prepare_only != true
        run: |
          LOG="${LLM_USAGE_LOG:-llm-usage.jsonl}"
          if [ -f "$LOG" ]; then
            python scripts/usage_report.py "$LOG" --warn-budget 50
          fi

  notify-failure:
    runs-on: ubuntu-latest
    needs: backfill
    if: failure()
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ Backfill Post Translations failed\n${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Print failure summary
        run: |
          echo "::error::Backfill Post Translations failed."
          echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"