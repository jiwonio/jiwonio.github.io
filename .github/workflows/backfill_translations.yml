name: Backfill Post Translations

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "처리할 원문 포스트 수 (0 = 전체)"
        required: false
        default: "0"
      langs:
        description: "번역 언어 (쉼표 구분)"
        required: false
        default: "en,ja,zh"
      sleep:
        description: "API 호출 간 대기(초)"
        required: false
        default: "5"
      prepare_only:
        description: "메타데이터 정규화만 수행"
        type: boolean
        required: false
        default: false
      slug:
        description: "특정 slug만 처리 (비우면 전체)"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LLM_USAGE_LOG: llm-usage.jsonl

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Verify git auth
        uses: ./.github/actions/verify-git-auth
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          pat: ${{ secrets.MY_PAT }}

      - name: Verify LLM secrets
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ] \
            && [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] \
            && [ -z "${{ secrets.OPENAI_API_KEY }}" ] \
            && [ -z "${{ secrets.XAI_API_KEY }}" ]; then
            echo "At least one LLM API key secret is required."
            exit 1
          fi

      - name: Run backfill script
        id: backfill_run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          ARGS=()
          if [ "${{ inputs.prepare_only }}" = "true" ]; then
            ARGS+=(--prepare)
          fi
          if [ "${{ inputs.limit }}" != "0" ]; then
            ARGS+=(--limit "${{ inputs.limit }}")
          fi
          if [ -n "${{ inputs.slug }}" ]; then
            ARGS+=(--slug "${{ inputs.slug }}")
            ARGS+=(--force-langs)
          fi
          ARGS+=(--langs "${{ inputs.langs }}")
          ARGS+=(--sleep "${{ inputs.sleep }}")
          python scripts/backfill_translations.py "${ARGS[@]}"

      - name: Pre-merge validation
        if: inputs.prepare_only != true
        id: pre_merge
        uses: ./.github/actions/pre-merge-validate

      - name: Setup git auth
        if: inputs.prepare_only != true
        uses: ./.github/actions/setup-git-auth
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          pat: ${{ secrets.MY_PAT }}

      - name: Create PR and auto-merge
        if: inputs.prepare_only != true
        run: |
          git config user.email "min@jiwon.io"
          git config user.name "jwjp"

          git add _posts/ scripts/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          BRANCH_NAME="backfill-translations-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          git commit -m "Backfill post translations (${{ inputs.langs }})"
          git push origin "$BRANCH_NAME"

          PR_BODY=$(cat <<'EOF'
          Backfill translations generated by the multi-LLM pipeline.

          ## Automated checks (all passed)
          - `validate_posts.py`
          - Translation completeness audit
          - Jekyll build + Pagefind + htmlproofer
          EOF
          )

          PR_URL=$(gh pr create \
            --title "🌐 Backfill translations (${{ inputs.langs }})" \
            --body "$PR_BODY" \
            --base gh-pages \
            --head "$BRANCH_NAME")

          gh pr merge "$BRANCH_NAME" --merge --delete-branch
          echo "✅ PR 자동 병합 완료: $PR_URL"

      - name: LLM usage report
        if: always() && inputs.prepare_only != true
        run: |
          LOG="${LLM_USAGE_LOG:-llm-usage.jsonl}"
          if [ -f "$LOG" ]; then
            python scripts/usage_report.py "$LOG" --warn-budget 50
          fi

      - name: Notify Slack (in-job failure detail)
        if: failure() && inputs.prepare_only != true
        uses: ./.github/actions/notify-slack-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: Backfill Post Translations failed
          failed-step: ${{ steps.pre_merge.outcome == 'failure' && 'pre-merge validation (tests, validate_posts, Jekyll, htmlproofer)' || steps.backfill_run.outcome == 'failure' && 'backfill script (LLM translation)' || 'see Actions log' }}

  notify-failure:
    runs-on: ubuntu-latest
    needs: backfill
    if: failure()
    steps:
      - uses: actions/checkout@v4
      - name: Notify Slack
        uses: ./.github/actions/notify-slack-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: Backfill Post Translations failed