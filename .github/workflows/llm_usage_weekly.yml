name: Weekly LLM Usage Report

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback days'
        required: false
        default: '7'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Summarize LLM usage from Actions logs
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          python scripts/usage_report.py --from-actions --days "$DAYS" --slack --warn-budget 50

  notify-failure:
    runs-on: ubuntu-latest
    needs: report
    if: failure()
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ Weekly LLM usage report failed\n${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Print failure summary
        run: |
          echo "::error::Weekly LLM usage report failed."
          echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"