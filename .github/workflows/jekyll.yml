# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["gh-pages"]

  pull_request:
    branches: ["gh-pages"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install -e ./scripts
      - name: Run Python unit tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Validate posts
        run: python scripts/validate_posts.py
      - name: Sync post images (dry-run)
        run: python scripts/sync_post_images.py --dry-run
      - name: Sync translation dates (dry-run)
        run: python scripts/sync_translation_dates.py --dry-run
      - name: Build site JS bundle
        run: python scripts/build_site_js.py
      - name: Verify font subsets
        run: python scripts/check_font_subset.py
      - name: Build with Jekyll
        if: github.event_name == 'pull_request'
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production
      - name: Build with Jekyll
        if: github.event_name != 'pull_request'
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Build Pagefind search index
        run: npx --yes pagefind@1.3.0 --site _site
      - name: Proof HTML (internal links)
        run: bundle exec htmlproofer ./_site --disable-external --allow-hash-href --ignore-empty-alt
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Notify IndexNow of new posts
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install -e ./scripts
          python scripts/submit_indexnow.py --from-git "$BEFORE_SHA" "$AFTER_SHA"
      - name: Post-deploy smoke test
        run: |
          curl -fsS https://blog.jiwon.io/
          curl -fsS https://blog.jiwon.io/posts/ollama-self-hosted-language-model-runner/

      - name: Lighthouse performance check
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          for i in 1 2 3; do curl -fsS https://blog.jiwon.io/ > /dev/null || true; done
          sleep 5
          npx --yes lighthouse@12 https://blog.jiwon.io/ \
            --output=json \
            --output-path=./lighthouse-report.json \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance
          PERF=$(python -c "import json; print(int(json.load(open('lighthouse-report.json'))['categories']['performance']['score']*100))")
          echo "Lighthouse performance: ${PERF}%"
          if [ "$PERF" -lt 80 ]; then
            echo "::warning::Lighthouse performance ${PERF}% is below threshold (80)"
            if [ -n "$SLACK_WEBHOOK_URL" ]; then
              RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              curl -sS -X POST -H 'Content-type: application/json' \
                --data "{\"text\":\"⚠️ Lighthouse ${PERF}% after deploy (target 80%)\n${RUN_URL}\"}" \
                "$SLACK_WEBHOOK_URL"
            fi
          fi

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report-deploy
          path: lighthouse-report.json
          retention-days: 30

  notify-failure:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure')
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ Jekyll deploy failed\n${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Print failure summary
        run: |
          echo "::error::Jekyll deploy failed."
          echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"