name: Dependabot auto-merge

on:
  workflow_run:
    workflows:
      - Deploy Jekyll site to Pages
      - E2E Smoke Tests
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup GitHub App / PAT auth
        uses: ./.github/actions/setup-git-auth
        with:
          app-id: ${{ secrets.DEPENDABOT_GH_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_GH_APP_PRIVATE_KEY }}
          pat: ${{ secrets.DEPENDABOT_MY_PAT }}

      - name: Merge Dependabot PR after required CI passes
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(gh api "repos/${REPO}/actions/runs/${CI_RUN_ID}" --jq '.pull_requests[0].number // empty')
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            PR_NUMBER=$(gh pr list --repo "$REPO" --head "${OWNER}:${HEAD_BRANCH}" --base gh-pages --state open --json number -q '.[0].number // empty')
          fi
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No open PR for ${HEAD_BRANCH} (already merged?)."
            exit 0
          fi

          jekyll_conclusion=$(gh api "repos/${REPO}/actions/workflows/jekyll.yml/runs" \
            -f head_sha="$HEAD_SHA" -f event=pull_request -f status=completed \
            --jq '.workflow_runs[0].conclusion // empty')
          if [ "$jekyll_conclusion" != "success" ]; then
            echo "Jekyll CI not successful yet for ${HEAD_SHA} (got: ${jekyll_conclusion:-none})."
            exit 0
          fi

          if gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' | grep -q '^e2e/'; then
            e2e_conclusion=$(gh api "repos/${REPO}/actions/workflows/e2e.yml/runs" \
              -f head_sha="$HEAD_SHA" -f event=pull_request -f status=completed \
              --jq '.workflow_runs[0].conclusion // empty')
            if [ "$e2e_conclusion" != "success" ]; then
              echo "E2E CI not successful yet for ${HEAD_SHA} (got: ${e2e_conclusion:-none})."
              exit 0
            fi
          fi

          echo "Required CI passed. Merging Dependabot PR #${PR_NUMBER}..."
          gh pr merge "$PR_NUMBER" --repo "$REPO" --merge --delete-branch
          echo "Merged PR #${PR_NUMBER} and deleted head branch."