name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for all dependency updates
        env:
          # Dependabot-triggered workflows only receive secrets named DEPENDABOT_*.
          GH_TOKEN: ${{ secrets.DEPENDABOT_MY_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add repository secret DEPENDABOT_MY_PAT (same value as MY_PAT). Dependabot workflows cannot read MY_PAT."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --merge --auto
          echo "Auto-merge enabled for PR #$PR_NUMBER (${UPDATE_TYPE:-unknown})"