name: Dependabot auto-merge

on:
  workflow_run:
    workflows:
      - Deploy Jekyll site to Pages
      - E2E Smoke Tests
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  merge:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DEPENDABOT_GH_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Merge Dependabot PR after checks pass
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT_TOKEN: ${{ secrets.DEPENDABOT_MY_PAT }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            GH_TOKEN="$APP_TOKEN"
            echo "Using GitHub App installation token."
          elif [ -n "$PAT_TOKEN" ]; then
            GH_TOKEN="$PAT_TOKEN"
            echo "Using DEPENDABOT_MY_PAT fallback."
          else
            echo "::error::Configure DEPENDABOT_GH_APP_ID + DEPENDABOT_GH_APP_PRIVATE_KEY or DEPENDABOT_MY_PAT."
            exit 1
          fi
          export GH_TOKEN

          PR_NUMBER=$(gh pr list --head "$HEAD_BRANCH" --base gh-pages --state open --json number -q '.[0].number')
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No open PR for $HEAD_BRANCH (already merged?)."
            exit 0
          fi

          echo "Waiting for PR #$PR_NUMBER checks to finish..."
          gh pr checks "$PR_NUMBER" --watch --fail-fast --interval 15

          gh pr merge "$PR_NUMBER" --merge --delete-branch
          echo "Merged PR #$PR_NUMBER"