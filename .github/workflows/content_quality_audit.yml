name: Content Quality and Discoverability Audit

# Posts-only audits. Full Pagefind discoverability runs on every Deploy (jekyll.yml).
on:
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch:
    inputs:
      skip_url_check:
        description: 'Skip live ai-news URL checks'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install -e ./scripts

      - name: Content quality audit
        run: |
          ARGS=()
          if [ "${{ github.event.inputs.skip_url_check }}" = "true" ]; then
            ARGS+=(--skip-url-check)
          fi
          python scripts/audit_content_quality.py "${ARGS[@]}"

      - name: Discoverability audit (posts only)
        run: python scripts/audit_discoverability.py --skip-pagefind

  notify-failure:
    runs-on: ubuntu-latest
    needs: [audit]
    if: failure()
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"⚠️ Content quality / discoverability audit failed\n${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"
