name: Weekly Lighthouse Audit

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run Lighthouse on homepage
        run: |
          npx --yes lighthouse@12 https://blog.jiwon.io/ \
            --output=json \
            --output-path=./lighthouse-report.json \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance

      - name: Check performance score
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          PERF=$(python -c "import json; print(int(json.load(open('lighthouse-report.json'))['categories']['performance']['score']*100))")
          echo "Lighthouse performance score: ${PERF}%"
          {
            echo "### Lighthouse Performance"
            echo "**Score:** ${PERF}% (threshold 80%)"
            echo "**URL:** https://blog.jiwon.io/"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PERF" -lt 80 ]; then
            echo "::warning::Lighthouse performance ${PERF}% is below threshold (80)"
            if [ -n "$SLACK_WEBHOOK_URL" ]; then
              RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              curl -sS -X POST -H 'Content-type: application/json' \
                --data "{\"text\":\"⚠️ Weekly Lighthouse ${PERF}% (target 80%)\n${RUN_URL}\"}" \
                "$SLACK_WEBHOOK_URL"
            fi
          fi

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report.json
          retention-days: 30

  notify-failure:
    runs-on: ubuntu-latest
    needs: lighthouse
    if: failure()
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ Weekly Lighthouse audit failed\n${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"