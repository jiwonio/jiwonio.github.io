name: Weekly Site Health

# Sunday production checks: Lighthouse homepage score + deep-dive dry-run
# (API key / generator pre-flight before Wednesday drafts).
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run Lighthouse on homepage
        run: |
          npx --yes lighthouse@12 https://blog.jiwon.io/ \
            --output=json \
            --output-path=./lighthouse-report.json \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance

      - name: Check performance score
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          PERF=$(python -c "import json; print(int(json.load(open('lighthouse-report.json'))['categories']['performance']['score']*100))")
          echo "Lighthouse performance score: ${PERF}%"
          {
            echo "### Lighthouse Performance"
            echo "**Score:** ${PERF}% (threshold 80%)"
            echo "**URL:** https://blog.jiwon.io/"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PERF" -lt 80 ]; then
            echo "::warning::Lighthouse performance ${PERF}% is below threshold (80)"
            if [ -n "$SLACK_WEBHOOK_URL" ]; then
              RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              curl -sS -X POST -H 'Content-type: application/json' \
                --data "{\"text\":\"⚠️ Weekly Lighthouse ${PERF}% (target 80%)\n${RUN_URL}\"}" \
                "$SLACK_WEBHOOK_URL"
            fi
          fi

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report.json
          retention-days: 30

  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install -e ./scripts

      - name: Verify LLM secrets
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ] \
            && [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] \
            && [ -z "${{ secrets.OPENAI_API_KEY }}" ] \
            && [ -z "${{ secrets.XAI_API_KEY }}" ]; then
            echo "At least one LLM API key secret is required."
            exit 1
          fi

      - name: Deep-dive generator dry-run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python scripts/generate_post.py --dry-run

  notify-failure:
    runs-on: ubuntu-latest
    needs: [lighthouse, dry-run]
    if: failure()
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ Weekly site health failed\n${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"
