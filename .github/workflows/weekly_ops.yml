name: Weekly Ops

# Saturday bundle: content quality, translations, live URLs, IndexNow,
# LLM spend, ops digest, and AI-draft watchdog. Replaces the former
# one-workflow-per-check Saturday/Sunday/monthly audits.
on:
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback days for LLM usage and ops digest'
        required: false
        default: '7'
      skip_live_urls:
        description: 'Skip live reference/external URL HEAD checks'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ops:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install -e ./scripts

      - name: Audit translation completeness
        run: python scripts/validate_posts.py --audit-translations

      - name: Validate reference and external URLs
        if: github.event.inputs.skip_live_urls != 'true'
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "URL validation attempt $attempt/3"
            python scripts/validate_posts.py --check-ref-urls --check-external-urls
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done
          echo "::warning::URL validation failed after 3 attempts"
          exit 1

      - name: Content quality audit
        run: python scripts/audit_content_quality.py

      - name: Discoverability audit (posts only)
        run: python scripts/audit_discoverability.py --skip-pagefind

      - name: IndexNow key file and recent URL resubmit
        run: python scripts/indexnow_audit.py --recent 8

      - name: Weekly LLM usage
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          python scripts/usage_report.py --from-actions --days "$DAYS" --slack --warn-budget 75
          python scripts/usage_report.py --from-actions --days "$DAYS" --markdown --output reports/llm-usage-weekly.md

      - name: Weekly ops digest
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          ARGS=(--days "$DAYS" --slack --markdown --output reports/ops-digest-weekly.md --skip-live-urls)
          python scripts/ops_digest.py "${ARGS[@]}"
          {
            echo "### Weekly Ops"
            echo "**Lookback:** ${DAYS} day(s)"
            echo "**Reports:** reports/ops-digest-weekly.md, reports/llm-usage-weekly.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload weekly reports
        uses: actions/upload-artifact@v7
        with:
          name: weekly-ops
          path: |
            reports/ops-digest-weekly.md
            reports/llm-usage-weekly.md
          if-no-files-found: ignore

      - name: AI draft pipeline watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -qE '^\s*-\s*cron:' .github/workflows/scheduled_ai_post.yml; then
            echo "scheduled_ai_post.yml has no active cron — AI draft schedule is paused."
            echo "Watchdog soft-pass (schedule disabled)."
            exit 0
          fi

          MAX_AGE_DAYS=14
          LAST_RUN=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/scheduled_ai_post.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty')

          if [ -z "$LAST_RUN" ]; then
            echo "::error::No successful scheduled_ai_post run found."
            exit 1
          fi

          echo "Last successful run: $LAST_RUN"
          LAST_EPOCH=$(date -d "$LAST_RUN" +%s)
          NOW_EPOCH=$(date -u +%s)
          AGE_DAYS=$(( (NOW_EPOCH - LAST_EPOCH) / 86400 ))
          echo "Age: ${AGE_DAYS} day(s) (max ${MAX_AGE_DAYS})"

          if [ "$AGE_DAYS" -gt "$MAX_AGE_DAYS" ]; then
            echo "::error::Last successful scheduled_ai_post run is older than ${MAX_AGE_DAYS} days."
            exit 1
          fi

          echo "Weekly AI draft pipeline is within ${MAX_AGE_DAYS}d."

  notify-failure:
    runs-on: ubuntu-latest
    needs: ops
    if: failure()
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ Weekly Ops failed\n${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"
