name: Missing Thumbnail Check

on:
  schedule:
    - cron: '0 7 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      - name: Check missing thumbnails
        id: check
        run: |
          set +e
          python scripts/generate_missing_thumbnails.py --dry-run
          echo "missing=$?" >> "$GITHUB_OUTPUT"
      - name: Generate missing thumbnails
        if: steps.check.outputs.missing == '1'
        run: python scripts/generate_missing_thumbnails.py
      - name: Commit generated thumbnails
        if: steps.check.outputs.missing == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uploads/ _posts/
          if git diff --cached --quiet; then
            echo "No thumbnail changes to commit."
            exit 0
          fi
          git commit -m "Generate missing post thumbnails"
          git pull --rebase origin gh-pages
          git push

  notify-failure:
    runs-on: ubuntu-latest
    needs: check-thumbnails
    if: failure()
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"⚠️ Missing Thumbnail Check failed\n${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Print failure summary
        run: |
          echo "::error::Missing Thumbnail Check failed."
          echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"