name: Missing Thumbnail Check

on:
  schedule:
    - cron: '0 7 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      - name: Check missing thumbnails
        id: check
        run: |
          set +e
          python scripts/generate_missing_thumbnails.py --dry-run
          echo "missing=$?" >> "$GITHUB_OUTPUT"
      - name: Generate missing thumbnails
        if: steps.check.outputs.missing == '1'
        run: python scripts/generate_missing_thumbnails.py
      - name: Commit generated thumbnails
        if: steps.check.outputs.missing == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uploads/ _posts/
          if git diff --cached --quiet; then
            echo "No thumbnail changes to commit."
            exit 0
          fi
          git commit -m "Generate missing post thumbnails [skip ci]"
          git push