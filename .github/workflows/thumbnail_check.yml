name: Missing Thumbnail Check

on:
  schedule:
    - cron: '0 7 * * 2'
  workflow_dispatch:

jobs:
  check-thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          python scripts/generate_missing_thumbnails.py --dry-run