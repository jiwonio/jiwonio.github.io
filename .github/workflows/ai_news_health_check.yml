name: AI News RSS Health Check

# Thursday pre-flight for Friday ai-news. Unit tests run on Deploy only.
# Re-enabled 2026-08-04 with scheduled_ai_post cron.
on:
  schedule:
    - cron: '0 6 * * 4'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install -e ./scripts

      - name: Run RSS dry-run (strict)
        run: python scripts/generate_ai_news.py --dry-run --strict

  notify-failure:
    runs-on: ubuntu-latest
    needs: health-check
    if: failure()
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"⚠️ AI News RSS health check failed\n${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Print failure summary
        run: |
          echo "::error::AI News RSS health check failed."
          echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
