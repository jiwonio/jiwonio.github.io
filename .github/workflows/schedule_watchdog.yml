name: Scheduled AI Post Watchdog

# Quality-first (2026-08-04): weekly deep-dive draft via PR, not thrice-weekly push.
# Checks that generation still runs; does NOT require same-day posts on gh-pages
# (editorial review may delay merge for days).
on:
  schedule:
    # Thursday 08:00 UTC — day after Wed draft generation
    - cron: '0 8 * * 4'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check weekly AI draft pipeline health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -qE '^\s*-\s*cron:' .github/workflows/scheduled_ai_post.yml; then
            echo "scheduled_ai_post.yml has no active cron — AI draft schedule is paused."
            echo "Watchdog soft-pass (schedule disabled)."
            exit 0
          fi

          # Max age: weekly cadence + buffer for missed weeks / review delay.
          MAX_AGE_DAYS=14

          LAST_RUN=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/scheduled_ai_post.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty')

          if [ -z "$LAST_RUN" ]; then
            echo "::error::No successful scheduled_ai_post run found."
            exit 1
          fi

          echo "Last successful run: $LAST_RUN"
          LAST_EPOCH=$(date -d "$LAST_RUN" +%s)
          NOW_EPOCH=$(date -u +%s)
          AGE_DAYS=$(( (NOW_EPOCH - LAST_EPOCH) / 86400 ))
          echo "Age: ${AGE_DAYS} day(s) (max ${MAX_AGE_DAYS})"

          if [ "$AGE_DAYS" -gt "$MAX_AGE_DAYS" ]; then
            echo "::error::Last successful scheduled_ai_post run is older than ${MAX_AGE_DAYS} days."
            echo "Quality-first policy still expects a weekly draft attempt (PR or push)."
            exit 1
          fi

          # Prefer open editorial PRs as a healthy signal under PR-only publish.
          OPEN_DRAFT_PRS=$(gh pr list \
            --base gh-pages \
            --state open \
            --search 'head:ai-post- in:title 편집 대기' \
            --json number,title,createdAt \
            --jq 'length' 2>/dev/null || echo "0")
          echo "Open editorial draft PRs (best-effort): ${OPEN_DRAFT_PRS}"

          # Optional soft check: after Wed UTC, prefer a success this calendar week.
          DOW=$(date -u +%u)
          if [ "$DOW" -ge 4 ]; then
            WEEK_START=$(date -u -d 'last wednesday' +%Y-%m-%dT00:00:00Z 2>/dev/null \
              || date -u -d '3 days ago' +%Y-%m-%dT00:00:00Z)
            RECENT=$(gh api \
              "/repos/${{ github.repository }}/actions/workflows/scheduled_ai_post.yml/runs?status=success&per_page=5" \
              --jq --arg since "$WEEK_START" \
              '[.workflow_runs[] | select(.created_at >= $since)] | length')
            echo "Successful runs since ${WEEK_START}: ${RECENT}"
            if [ "${RECENT:-0}" -eq 0 ] && [ "$AGE_DAYS" -gt 7 ]; then
              echo "::warning::No successful AI post run since mid-week window; last success ${AGE_DAYS}d ago."
            fi
          fi

          echo "Weekly AI draft pipeline is within the quality-first window (${MAX_AGE_DAYS}d)."

  notify-failure:
    runs-on: ubuntu-latest
    needs: watchdog
    if: failure()
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"⚠️ schedule_watchdog failed (quality-first weekly draft): ${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"
