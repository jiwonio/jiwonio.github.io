name: Scheduled AI Post Watchdog

# Daily 08:00 UTC — fails if last successful AI post run is older than 4 days
# (and checks expected post presence on Mon/Wed/Fri).
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check last successful AI post generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # While scheduled_ai_post.yml has no cron, only report status (do not fail).
          if ! grep -qE '^\s*-\s*cron:' .github/workflows/scheduled_ai_post.yml; then
            echo "scheduled_ai_post.yml has no active cron — AI auto-posting is paused."
            echo "Watchdog soft-pass (AdSense remediation)."
            exit 0
          fi

          LAST_RUN=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/scheduled_ai_post.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty')

          if [ -z "$LAST_RUN" ]; then
            echo "::error::No successful scheduled_ai_post run found."
            exit 1
          fi

          echo "Last successful run: $LAST_RUN"
          LAST_EPOCH=$(date -d "$LAST_RUN" +%s)
          NOW_EPOCH=$(date -u +%s)
          AGE_DAYS=$(( (NOW_EPOCH - LAST_EPOCH) / 86400 ))
          echo "Age: ${AGE_DAYS} day(s)"

          if [ "$AGE_DAYS" -gt 4 ]; then
            echo "::error::Last successful scheduled_ai_post run is older than 4 days."
            exit 1
          fi

          DOW=$(date -u +%u)
          TODAY=$(date -u +%Y-%m-%d)
          EXPECTED_KIND=""
          EXPECTED_SLUG=""
          case "$DOW" in
            1|3) EXPECTED_KIND="deep-dive"; EXPECTED_SLUG="${TODAY}-" ;;
            5)   EXPECTED_KIND="ai-news"; EXPECTED_SLUG="${TODAY}-ai-news-${TODAY}" ;;
          esac

          if [ -n "$EXPECTED_KIND" ]; then
            MATCH=$(git ls-tree -r --name-only HEAD "_posts/ko" \
              | grep -F "${EXPECTED_SLUG}" || true)
            if [ -z "$MATCH" ]; then
              echo "::error::Expected ${EXPECTED_KIND} post for ${TODAY} is missing on gh-pages."
              exit 1
            fi
            echo "Expected ${EXPECTED_KIND} post present: ${MATCH}"
          else
            echo "No scheduled AI post expected today (DOW=${DOW})."
          fi

          echo "Scheduled AI post generation is within the expected window."

  notify-failure:
    runs-on: ubuntu-latest
    needs: watchdog
    if: failure()
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"⚠️ schedule_watchdog failed: ${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"
