name: Weekly Sync Maintenance

on:
  schedule:
    - cron: '0 5 * * 3'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install -e ./scripts

      - name: Verify git auth
        uses: ./.github/actions/verify-git-auth
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          pat: ${{ secrets.MY_PAT }}

      - name: Run sync scripts
        run: |
          python scripts/sync_post_images.py
          python scripts/sync_translation_dates.py
          python scripts/build_site_js.py
          python scripts/check_font_subset.py --fix

      - name: Content validation gate
        id: pre_merge
        uses: ./.github/actions/pre-merge-validate

      - name: Setup git auth
        uses: ./.github/actions/setup-git-auth
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          pat: ${{ secrets.MY_PAT }}

      - name: Commit and push to gh-pages
        run: |
          git config --local user.email "min@jiwon.io"
          git config --local user.name "jwjp"

          git add _posts/ assets/vendor/ _data/noto_preload.yml assets/js/site.js
          if git diff --cached --quiet; then
            echo "No sync changes to commit."
            exit 0
          fi

          git commit -m "Sync post images and translation dates"
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
          echo "✅ gh-pages 직푸시 완료"

      - name: Notify Slack (in-job failure detail)
        if: failure()
        uses: ./.github/actions/notify-slack-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: Weekly Sync Maintenance failed
          failed-step: ${{ steps.pre_merge.outcome == 'failure' && 'content validation gate' || 'see Actions log' }}
