name: Weekly Sync Maintenance

on:
  schedule:
    - cron: '0 5 * * 3'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Verify git auth
        uses: ./.github/actions/verify-git-auth
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          pat: ${{ secrets.MY_PAT }}

      - name: Run sync scripts
        run: |
          python scripts/sync_post_images.py
          python scripts/sync_translation_dates.py

      - name: Pre-merge validation
        uses: ./.github/actions/pre-merge-validate

      - name: Setup git auth
        uses: ./.github/actions/setup-git-auth
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          pat: ${{ secrets.MY_PAT }}

      - name: Create PR and auto-merge
        run: |
          git config --local user.email "min@jiwon.io"
          git config --local user.name "jwjp"

          git add _posts/
          if git diff --cached --quiet; then
            echo "No sync changes to commit."
            exit 0
          fi

          BRANCH_NAME="sync-maintenance-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          git commit -m "Sync post images and translation dates"

          git push origin "$BRANCH_NAME"

          PR_URL=$(gh pr create \
            --title "🔧 Weekly sync: images and translation dates" \
            --body "Automated sync. All pre-merge validation checks passed." \
            --base gh-pages \
            --head "$BRANCH_NAME")

          gh pr merge "$BRANCH_NAME" --merge --delete-branch
          echo "✅ PR 자동 병합 완료: $PR_URL"

  notify-failure:
    runs-on: ubuntu-latest
    needs: sync
    if: failure()
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ Weekly sync maintenance failed\n${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"