name: Weekly Sync Maintenance

on:
  schedule:
    - cron: '0 5 * * 3'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.MY_PAT }}" ]; then
            echo "MY_PAT secret is missing (needed for PR creation)."
            exit 1
          fi

      - name: Run sync scripts
        run: |
          python scripts/sync_post_images.py
          python scripts/sync_translation_dates.py

      - name: Create PR if changes
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          git config --local user.email "min@jiwon.io"
          git config --local user.name "jwjp"
          gh auth setup-git

          git add _posts/
          if git diff --cached --quiet; then
            echo "No sync changes to commit."
            exit 0
          fi

          BRANCH_NAME="sync-maintenance-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          git commit -m "Sync post images and translation dates"

          git push origin "$BRANCH_NAME"

          PR_URL=$(gh pr create \
            --title "🔧 Weekly sync: images and translation dates" \
            --body "Automated sync from \`sync_post_images.py\` and \`sync_translation_dates.py\`. Review front matter changes before merge." \
            --base gh-pages \
            --head "$BRANCH_NAME")

          echo "PR Created: $PR_URL"

  notify-failure:
    runs-on: ubuntu-latest
    needs: sync
    if: failure()
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ Weekly sync maintenance failed\n${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Print failure summary
        run: |
          echo "::error::Weekly sync maintenance failed."
          echo "Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"