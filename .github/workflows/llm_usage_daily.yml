name: Daily LLM Budget Check

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  budget-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install -e ./scripts

      - name: Check daily LLM budget projection
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python scripts/usage_report.py --from-actions --days 1 --warn-budget 75 --slack-on-warn
          python scripts/usage_report.py --from-actions --days 1 --markdown --output reports/llm-usage-daily.md
          {
            echo "### Daily LLM Budget"
            echo "Lookback: 1 day"
            echo "Report: reports/llm-usage-daily.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload daily LLM dashboard
        uses: actions/upload-artifact@v4
        with:
          name: llm-usage-daily
          path: reports/llm-usage-daily.md
          if-no-files-found: ignore

  notify-failure:
    runs-on: ubuntu-latest
    needs: budget-check
    if: failure()
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ Daily LLM budget check failed\n${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"