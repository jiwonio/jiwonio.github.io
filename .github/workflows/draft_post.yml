name: Draft Post from Topic

# Operator picks the topic. AI writes a draft PR for editorial review.
# No schedule — run from Actions → Run workflow when you have a subject.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: '글 주제 (필수). 예: Cursor로 PR 리뷰 밀림 줄이기'
        required: true
        type: string
      angle:
        description: '글 각도'
        required: false
        default: 'freeform'
        type: choice
        options:
          - freeform
          - before-after
          - failure
          - decision
          - hidden-cost
          - team
      notes:
        description: '실측·실패·경험 메모. 없으면 수치를 창작하지 않음'
        required: false
        default: ''
        type: string
      direct_push:
        description: 'true=gh-pages 직푸시 / false=PR만 (기본)'
        required: false
        default: false
        type: boolean
      text_provider:
        description: '글 생성 LLM provider (auto=deep-dive 라우팅)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - gemini
          - anthropic
          - openai
          - xai
      translation_provider:
        description: '번역 LLM provider (auto=폴백 체인)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - gemini
          - anthropic
          - openai
          - xai
      edition_date:
        description: '날짜 고정 (YYYY-MM-DD). 비우면 오늘'
        required: false
        default: ''
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LLM_USAGE_LOG: llm-usage.jsonl

concurrency:
  group: draft-post-generation
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install -e ./scripts

      - name: Verify git auth
        uses: ./.github/actions/verify-git-auth
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          pat: ${{ secrets.MY_PAT }}

      - name: Verify LLM secrets
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ] \
            && [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] \
            && [ -z "${{ secrets.OPENAI_API_KEY }}" ] \
            && [ -z "${{ secrets.XAI_API_KEY }}" ]; then
            echo "At least one LLM API key secret is required."
            exit 1
          fi

      - name: Run generation script
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          POST_TOPIC: ${{ github.event.inputs.topic }}
          POST_ANGLE: ${{ github.event.inputs.angle || 'freeform' }}
          POST_NOTES: ${{ github.event.inputs.notes }}
        run: |
          if [ -z "${POST_TOPIC// }" ]; then
            echo "topic is required."
            exit 1
          fi

          # Topic/angle/notes come from env (POST_*) so $ and quotes in the
          # subject cannot break the shell argument list.
          TEXT_PROVIDER="${{ github.event.inputs.text_provider || 'auto' }}"
          TRANSLATION_PROVIDER="${{ github.event.inputs.translation_provider || 'auto' }}"
          EXTRA_ARGS=()
          if [ "$TEXT_PROVIDER" != "auto" ]; then
            EXTRA_ARGS+=(--text-provider "$TEXT_PROVIDER")
          fi
          if [ "$TRANSLATION_PROVIDER" != "auto" ]; then
            EXTRA_ARGS+=(--translation-provider "$TRANSLATION_PROVIDER")
          fi
          EDITION_DATE="${{ github.event.inputs.edition_date }}"
          if [ -n "$EDITION_DATE" ]; then
            EXTRA_ARGS+=(--date "$EDITION_DATE")
          fi

          python scripts/generate_post.py "${EXTRA_ARGS[@]}"
      - name: Refresh derived assets
        run: |
          python scripts/build_site_js.py
          python scripts/check_font_subset.py --fix

      - name: Content validation gate
        id: pre_merge
        uses: ./.github/actions/pre-merge-validate

      - name: Setup git auth
        uses: ./.github/actions/setup-git-auth
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          pat: ${{ secrets.MY_PAT }}

      - name: Commit and publish
        env:
          POST_TOPIC: ${{ github.event.inputs.topic }}
          DIRECT_PUSH: ${{ github.event.inputs.direct_push }}
        run: |
          git config --local user.email "min@jiwon.io"
          git config --local user.name "jwjp"

          git add _posts/ uploads/ assets/vendor/ _data/noto_preload.yml assets/js/site.js

          if git diff --cached --quiet; then
            echo "⚠️ 커밋할 새로운 변경 사항이 없습니다."
            exit 0
          fi

          python - <<'PY'
          import os
          from pathlib import Path

          topic = os.environ.get("POST_TOPIC", "").strip() or "untitled"
          title = f"📝 [편집 대기] {topic}"
          if len(title) > 80:
              title = title[:77] + "..."
          Path("/tmp/commit-msg.txt").write_text(f"Add draft post: {topic}\n", encoding="utf-8")
          Path("/tmp/pr-title.txt").write_text(title, encoding="utf-8")
          Path("/tmp/pr-body.md").write_text(
              f"""## 품질 우선 정책 — 편집 후 머지

          운영자가 정한 주제의 AI 초안입니다. **그대로 머지하지 마세요.**

          **주제:** {topic}

          ### 편집 체크리스트
          - [ ] 실제 경험·실측 수치·실패 사례 중 1개 이상 반영
          - [ ] 과장·일반론·문서 복붙 톤 제거
          - [ ] 기존 글과 주제가 겹치면 신규 대신 기존 글 보강 검토
          - [ ] 참고 링크·명령·버전 정보 확인
          - [ ] (선택) 번역본 핵심 문장 스팟 체크

          ### 자동 통과 항목 (콘텐츠 게이트)
          - `validate_posts.py` (metadata, links, language, translation structure)
          - Changed-post reference URL HEAD checks
          - Translation completeness audit
          - Sync drift dry-run (images, dates)
          - Font subset verify

          Full Jekyll + Pagefind + htmlproofer runs on Deploy after merge.
          """,
              encoding="utf-8",
          )
          PY

          if [ "$DIRECT_PUSH" = "true" ]; then
            git commit -F /tmp/commit-msg.txt
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
            echo "✅ gh-pages 직푸시 완료 (IndexNow·Jekyll 빌드는 Deploy 워크플로에서 처리)"
            echo "⚠️ direct_push=true was used — prefer PR + editorial review for quality."
          else
            BRANCH_NAME="draft-post-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH_NAME"
            git commit -F /tmp/commit-msg.txt
            git push origin "$BRANCH_NAME"

            PR_URL=$(gh pr create \
              --title "$(cat /tmp/pr-title.txt)" \
              --body-file /tmp/pr-body.md \
              --base gh-pages \
              --head "$BRANCH_NAME")
            echo "PR opened for editorial review: $PR_URL"
          fi

      - name: LLM usage report
        if: always() && steps.generate.outcome != 'skipped'
        run: |
          LOG="${LLM_USAGE_LOG:-llm-usage.jsonl}"
          if [ -f "$LOG" ]; then
            python scripts/usage_report.py "$LOG" --warn-budget 75
          fi

      - name: Notify Slack (in-job failure detail)
        if: failure()
        uses: ./.github/actions/notify-slack-failure
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: Draft Post from Topic failed
          failed-step: ${{ steps.pre_merge.outcome == 'failure' && 'content validation gate (validate_posts, refs, translations)' || steps.generate.outcome == 'failure' && 'post generation (LLM pipeline)' || 'see Actions log' }}
