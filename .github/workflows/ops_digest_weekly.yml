name: Weekly Ops Digest

on:
  schedule:
    - cron: '0 8 * * 6'
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback days'
        required: false
        default: '7'
      skip_live_urls:
        description: 'Skip live reference URL checks'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install -e ./scripts

      - name: Generate weekly ops digest
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          ARGS=(--days "$DAYS" --slack --markdown --output reports/ops-digest-weekly.md)
          if [ "${{ github.event.inputs.skip_live_urls }}" = "true" ]; then
            ARGS+=(--skip-live-urls --skip-content-url-check)
          fi
          python scripts/ops_digest.py "${ARGS[@]}"
          {
            echo "### Weekly Ops Digest"
            echo "**Lookback:** ${DAYS} day(s)"
            echo "**Report:** reports/ops-digest-weekly.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ops digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: ops-digest-weekly
          path: reports/ops-digest-weekly.md
          if-no-files-found: ignore

  notify-failure:
    runs-on: ubuntu-latest
    needs: digest
    if: failure()
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ Weekly ops digest failed\n${RUN_URL}\"}" \
            "$SLACK_WEBHOOK_URL"