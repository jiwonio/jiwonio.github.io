<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
    {% include head.html %}
    <body>
        <div class="container content">
            <header class="masthead">
                <h3 class="masthead-title">
                    <a href="/" title="Home">{{ site.title }}</a>
                    <small><i class="fa fa-code"></i> {{ site.tagline }}</small>
                </h3>
                <nav>
                    <a href="https://twitter.com/{{ site.author.twitter }}" title="X (formerly Twitter)" target="_blank" rel="noopener noreferrer"><i class="fa fa-twitter"></i></a>
                    <a href="https://github.com/{{ site.author.github }}" title="GitHub" target="_blank" rel="noopener noreferrer"><i class="fa fa-github"></i></a>
                    <a href="mailto:{{ site.author.email }}" title="e-mail"><i class="fa fa-envelope"></i></a>
                    <button type="button" id="theme-toggle" class="theme-toggle" data-theme-preference="system" aria-label="시스템 설정 (클릭하여 변경)" title="시스템 설정">
                        <i class="fa fa-adjust" aria-hidden="true"></i>
                    </button>
                </nav>
                <div class="cf"></div>
            </header>

            <main>
                {{ content | replace: '<!--more-->', '' }}
            </main>

            <footer class="footer">
                <img src="https://www.gravatar.com/avatar/8b77c02d2acf93b8d9089ce7ce249ce8?s=160" alt="Gravatar">
                <ul>
                    <li>Made with ❤ using <a href="https://jekyllrb.com/" title="Jekyll" target="_blank" rel="noopener noreferrer">Jekyll</a></li>
                    <li>A web developer living in <a href="https://en.wikipedia.org/wiki/South_Korea" title="Wikipedia: South Korea" target="_blank" rel="noopener noreferrer">South Korea🌏</a></li>
                    <li>All ramblings can be found in the <a href="/archive/" title="Archive">Archive</a></li>
                </ul>
                <div class="cf"></div>
            </footer>
        </div>
        <script src="/assets/js/theme.js" defer></script>
    </body>
</html>
